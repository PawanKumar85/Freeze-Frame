services:
  hls-freeze-monitor:
    build: .
    image: hls-freeze-monitor:latest
    container_name: hls-freeze-monitor
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MALLOC_ARENA_MAX=2
    cpus: 0.50
    mem_limit: 256m
    restart: unless-stopped
